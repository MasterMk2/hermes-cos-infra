# Hermes Daily Planning & Morning Brief — sample configuration.
#
# Installed to /srv/hermes/planning/config.yaml by install-root.sh, which never
# overwrites an existing file. Override the location with
# HERMES_PLANNING_CONFIG.
#
# =========================================================================
#  CHANGING THE MORNING BRIEF TIME  (phase section 53 — single config source)
# =========================================================================
#   1. edit `morning_brief.time` below, in the INSTALLED file
#        sudo nano /srv/hermes/planning/config.yaml
#   2. re-run the installer so the systemd timer is re-rendered from it
#        sudo bash <repo>/src/planning/install-root.sh
#   3. confirm
#        systemctl list-timers hermes-morning-brief.timer
#
# The value here is the ONLY place the time is written. The .timer file is
# generated from it; editing the .timer directly is overwritten on the next
# install and will silently disagree with the late-boot window computed by the
# service. Do not edit /etc/systemd/system/hermes-morning-brief.timer by hand.
# =========================================================================

timezone: "Asia/Tokyo"

morning_brief:
  # HH:MM in `timezone` above. 08:30 preserves the owner's existing morning
  # slot (the `chief-morning-review` job runs at 30 23 * * * UTC = 08:30 JST),
  # which phase section 53 requires rather than replacing it with a fresh
  # 08:00 default.
  time: "08:30"

  # Phase section 56. The Pi boots at 12:00 and the 08:30 run was missed:
  # within this many hours of the slot, still send; later, skip the day.
  # `--trigger manual` bypasses this window but never the idempotency check.
  late_boot_grace_hours: 3

  # The other side of the same window. `Persistent=true` on the timer fires a
  # missed elapse the moment the Pi comes back, at whatever hour that is — so
  # a boot at 02:00 used to push today's brief to Discord at 02:00 and consume
  # `morning-brief:YYYY-MM-DD`, after which the real 08:30 run answered
  # `suppressed_duplicate` and the owner got no brief at the configured hour.
  # A run more than this many seconds BEFORE the slot returns `skipped_early`
  # and records nothing, so the scheduled elapse still delivers. Wide enough
  # for clock skew, far too narrow for a boot hour.
  early_tolerance_seconds: 300

  # Phase sections 61 and 99. "discord" is the only accepted value; anything
  # else refuses to deliver rather than being honoured, and there is no code
  # path from this service to LINE.
  channel: "discord"

  enabled: true

  # Phase section 60. Off by default: a brief that cannot be generated is
  # usually a source or configuration problem that persists for days, and a
  # daily "it broke" push is the notification flood section 126 forbids. The
  # health file and `journalctl -u hermes-morning-brief` are the primary
  # channel. When true, a short Discord-only failure NOTICE (never a brief) is
  # sent under its own `morning-brief-failure:` id.
  notify_on_failure: false

  # Seconds to wait on the gateway's unix socket.
  socket_timeout_seconds: 30

# Plan-size caps. See I2-AMENDMENT section F: these are the measured
# production numbers, not guesses.
limits:
  scheduled: 5
  must_do: 5
  overdue: 5
  next_up: 5
  waiting_for: 7
  backlog: 3

overdue_per_counterparty_cap: 2

windows:
  next_up_hours: 72
  imminent_hours: 3
  followup_days: 7
  # Measured from the source message. An older waiting row stays only while
  # it has a date today or later; unassigned group requests (SHARED/BLOCKED)
  # are only counted (counts.needs_review), never listed as 返事待ち.
  waiting_max_age_days: 30
  needs_review_days: 14
  conflict_default_duration_minutes: 60
  dense_window_minutes: 90

# Seconds after which a source is reported stale. A stale source adds
# `data_freshness_warning` to the plan and marks the run degraded; it never
# stops the brief (phase section 37).
freshness_thresholds_seconds:
  calendar: 86400
  gmail: 86400
  line: 172800
  discord: 172800
  commitments: 86400

paths:
  # Canonical truth. Opened read-only, and mounted read-only by the service
  # unit as well (phase section 64).
  events_db: "/srv/hermes/hermes-data/events/events.db"
  # Planning state and the health file. The only directory this service may
  # write (phase sections 65, 68).
  planning_dir: "/srv/hermes/hermes-data/planning"
  # The gateway's proactive socket. This service holds no Discord or LINE
  # token; the gateway owns both and fixes the recipient (phase sections 51,
  # 52, 69).
  gateway_proactive_socket: "/srv/hermes/channel-gateway/run/proactive.sock"

# Read-only inputs the freshness probe uses to decide whether a source is
# stale (I2-PROFILE.md section G verified every one of these is readable
# without root). An empty string disables a probe rather than inventing a
# source: that source then reports stale with an explicit reason instead of
# silently claiming to be fresh. Change a path here if a source moves.
freshness_sources:
  calendar_index_db: "/srv/hermes/calendar/index/index.db"
  gmail_status_json: "/srv/hermes/gmail/index/status.json"
  gmail_index_db: "/srv/hermes/gmail/index/index.db"
  line_reconcile_health_json: "/srv/hermes/hermes-data/events/line-reconcile-health.json"
  line_index_db: "/srv/hermes/hermes-data/knowledge-index/line/index.db"
  discord_collector_db: "/srv/hermes/knowledge/discord/messages.db"

renderer:
  # auto: try the LLM renderer, fall back to the deterministic template.
  # With `llm.enabled: false` below there is no LLM client to try, so `auto`
  # is the template — deterministically, with no network and no token.
  mode: "auto"
  timeout_seconds: 30
  # The gateway rejects anything longer (gw_proactive.MAX_NOTIFICATION_CHARS).
  max_chars: 1200

  # =====================================================================
  #  THE SCHEDULED BRIEF SHIPS TEMPLATE-ONLY.
  # =====================================================================
  # Phase section 108 makes an *unavoidable* security-boundary expansion a
  # stop condition. This one is avoidable: the deterministic template is a
  # complete brief (phase section 76), so the service needs no TCP socket
  # (`RestrictAddressFamilies=AF_UNIX`) and no credential of any kind.
  # A deterministic renderer also cannot invent a task or a deadline, which
  # is the section 100 quality gate for free.
  #
  # LLM rendering is still demonstrated in this phase, on the on-demand
  # Discord path: Antigravity renders `daily_plan_get` output under its own
  # existing credentials and this service is not involved.
  #
  # Turning `enabled` on is a deliberate boundary change and needs BOTH:
  #   1. `sudo PLANNER_RENDERER_NET=1 bash install-root.sh` — widens the unit
  #      to AF_UNIX AF_INET AF_INET6;
  #   2. a token readable by `hermesplanner` at `token_file`.
  # Read the RENDERER NETWORK note in hermes-morning-brief.service.in first.
  llm:
    enabled: false
    # url: "http://172.18.0.1:8765/v1/chat/completions"   # renderer.DEFAULT_BRIDGE_URL
    # model: "gemini-3.8-flash-medium"                    # renderer.DEFAULT_MODEL
    # token_file: ""
    # token_env: "HERMES_BRIDGE_TOKEN"
