# Installed as /etc/systemd/system/hermes-calendar.service.d/30-hermes-data-binds.conf
# See hermes-morning-brief.conf for why. The calendar service reads events.db
# (deterministic Event Layer linkage); nothing else under hermes-data.
[Service]
TemporaryFileSystem=/srv/hermes/hermes-data:ro
BindReadOnlyPaths=-/srv/hermes/hermes-data/events
