# Installed as /etc/systemd/system/hermes-classifier-broker.service.d/30-hermes-data-binds.conf
# See hermes-morning-brief.conf for why. ExecStart is a script under
# /srv/hermes/hermes-data/tools/events, so without this the broker cannot even
# start while the directory is 0700. Its fallback read of
# /srv/hermes/hermes-data/config.yaml was already denied (0600, owner only);
# the file is now simply absent from the namespace.
[Service]
TemporaryFileSystem=/srv/hermes/hermes-data:ro
BindReadOnlyPaths=/srv/hermes/hermes-data/tools/events
