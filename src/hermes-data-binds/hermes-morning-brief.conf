# Installed as /etc/systemd/system/hermes-morning-brief.service.d/30-hermes-data-binds.conf
#
# The Hermes agent chmods /srv/hermes/hermes-data to 0700 on every auth-store
# save (hermes_constants.secure_parent_dir), overriding HERMES_HOME_MODE=0710.
# chmod 0700 sets the ACL mask to ---, so this unit lost traversal and the
# 2026-10-26 brief failed with PermissionError. Inside this unit's namespace,
# replace the directory with an empty read-only tmpfs and bind back only what
# the planner uses, at the same paths. PID 1 resolves bind sources as root, so
# the host mode no longer matters; DAC on each subdirectory still applies.
[Service]
TemporaryFileSystem=/srv/hermes/hermes-data:ro
BindReadOnlyPaths=/srv/hermes/hermes-data/events
BindReadOnlyPaths=-/srv/hermes/hermes-data/knowledge-index
BindPaths=/srv/hermes/hermes-data/planning
