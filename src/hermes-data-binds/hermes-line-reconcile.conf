# Installed as /etc/systemd/system/hermes-line-reconcile.service.d/30-hermes-data-binds.conf
# See hermes-morning-brief.conf for why. Same paths as the unit's existing
# ReadOnlyPaths= / ReadWritePaths=, now bound in independently of the mode of
# /srv/hermes/hermes-data itself.
[Service]
TemporaryFileSystem=/srv/hermes/hermes-data:ro
BindReadOnlyPaths=/srv/hermes/hermes-data/tools
BindReadOnlyPaths=/srv/hermes/hermes-data/commitments
BindReadOnlyPaths=/srv/hermes/hermes-data/knowledge-index/line
BindPaths=/srv/hermes/hermes-data/events
BindPaths=/srv/hermes/hermes-data/logs
