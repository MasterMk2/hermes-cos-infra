# Installed as /etc/systemd/system/hermes-antigravity.service.d/30-hermes-data-binds.conf
# See hermes-morning-brief.conf for why. The native MCP servers spawned by the
# Antigravity CLI read events.db, the knowledge indexes, LINE/event tool
# scripts, planning state and line-refresh.log. All read-only; .env,
# auth.json, config.yaml, sessions and memories are no longer in the namespace.
[Service]
TemporaryFileSystem=/srv/hermes/hermes-data:ro
BindReadOnlyPaths=-/srv/hermes/hermes-data/tools
BindReadOnlyPaths=-/srv/hermes/hermes-data/commitments
BindReadOnlyPaths=-/srv/hermes/hermes-data/events
BindReadOnlyPaths=-/srv/hermes/hermes-data/knowledge-index
BindReadOnlyPaths=-/srv/hermes/hermes-data/planning
BindReadOnlyPaths=-/srv/hermes/hermes-data/logs
