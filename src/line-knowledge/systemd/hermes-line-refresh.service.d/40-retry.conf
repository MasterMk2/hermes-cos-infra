# Installed as /etc/systemd/system/hermes-line-refresh.service.d/40-retry.conf
#
# The refresh runs once a day at 01:30, and a failed run used to leave the
# LINE index and the morning brief stale for a whole day (2026-10-23..26 all
# failed with "remote page fetch failed rc=7"). Retry a few times overnight
# so a short outage of the MyLINE source costs an hour, not a day. A longer
# outage still ends in a failed unit after the last attempt.
#
# Not retried: 5 / 6 (the snapshot or index failed validation, which a rerun
# will not fix) and 10 (another refresh holds the lock).
[Unit]
StartLimitIntervalSec=4h
StartLimitBurst=4

[Service]
Restart=on-failure
RestartSec=30min
RestartPreventExitStatus=5 6 10
