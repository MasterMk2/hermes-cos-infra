# Phase J.1 drop-in for channel-gateway.service.
#
# One line of substance: the gateway needs the broker credential, and it must
# arrive the same way its other four do — systemd reads the root-owned 0400
# file as root and drops a copy into the unit-scoped tmpfs. The service user
# never gains read access to /etc/hermes-secrets, and the token appears in no
# environment variable and on no command line.
#
# Nothing else about the unit changes. In particular the gateway keeps
# InaccessiblePaths=/srv/hermes/hermes-data: it reaches the broker over
# loopback TCP and has no business reading the job database itself.

[Service]
LoadCredential=coding_handoff_token:/etc/hermes-secrets/coding-handoff-token
